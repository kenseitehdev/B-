name: Native codegen
on:
  push:
    branches: [main, "1.0.*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
        mode: [release, debug, tsan]
        compiler: [clang]
        include:
          - {os: ubuntu-24.04, mode: release, compiler: gcc}
          - {os: ubuntu-24.04, mode: debug, compiler: gcc}
          - {os: ubuntu-24.04, mode: tsan, compiler: gcc}
          - {os: ubuntu-24.04-arm, mode: release, compiler: gcc}
          - {os: ubuntu-24.04-arm, mode: debug, compiler: gcc}
          - {os: ubuntu-24.04-arm, mode: tsan, compiler: gcc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Discard checked-in build artifacts
        shell: bash
        run: rm -rf build bin
      - name: Verify native runner architecture
        run: |
          machine=$(uname -m)
          case "${{ matrix.os }}" in
            macos-15) test "$machine" = arm64 ;;
            ubuntu-24.04) test "$machine" = x86_64 ;;
            ubuntu-24.04-arm) test "$machine" = aarch64 ;;
            *) echo "Unexpected Unix runner: ${{ matrix.os }} ($machine)" >&2; exit 1 ;;
          esac
      - name: Homebrew LLVM
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install Linux metadata and debugger tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb llvm
      - name: Record native runner and toolchain
        run: |
          log="verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
          {
            echo "revision=$GITHUB_SHA"
            echo "runner=${{ matrix.os }}"
            echo "mode=${{ matrix.mode }}"
            echo "uname=$(uname -a)"
            ${{ matrix.compiler }} --version
            make --version
            command -v readelf || true
            command -v llvm-dwarfdump || true
            command -v llvm-readobj || true
            command -v lldb || true
            command -v gdb || true
          } | tee "$log"
      - name: Probe sanitizer runtimes
        env:
          BPP_REQUIRED_SANITIZERS: ${{ matrix.mode == 'debug' && (runner.os == 'Linux' && 'address leak undefined' || 'address undefined') || matrix.mode == 'tsan' && 'thread' || '' }}
        run: |
          set -o pipefail
          make CC=${{ matrix.compiler }} check-sanitizer-availability 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Compiler warnings as errors
        run: |
          set -o pipefail
          make CC=${{ matrix.compiler }} BUILD_MODE=${{ matrix.mode }} CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -Werror' -j2 all 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Compiler and native execution
        run: |
          set -o pipefail
          python3 tests/run_bounded.py 600 make CC=${{ matrix.compiler }} BUILD_MODE=${{ matrix.mode }} -j2 test ${{ matrix.mode == 'release' && 'check-static-abi' || '' }} 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Bounded fuzz, stress and reproducibility
        run: |
          set -o pipefail
          python3 tests/run_bounded.py 600 make CC=${{ matrix.compiler }} BUILD_MODE=${{ matrix.mode }} -j2 check-fuzz check-verification check-reproducible 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Differential execution
        run: |
          set -o pipefail
          make CC=${{ matrix.compiler }} BUILD_MODE=${{ matrix.mode }} check-differential 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Native ASAN access hook
        if: matrix.mode == 'debug'
        run: |
          set -o pipefail
          make CC=${{ matrix.compiler }} BUILD_MODE=debug check-asan-hook 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Cross-target assembly
        if: matrix.mode == 'release'
        run: |
          set -o pipefail
          make CC=${{ matrix.compiler }} BUILD_MODE=release check-targets 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Large procedure and branches
        if: matrix.mode == 'release'
        run: |
          set -o pipefail
          make CC=${{ matrix.compiler }} BUILD_MODE=release check-stress 2>&1 | tee -a "verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log"
      - name: Upload failing metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}
          path: |
            build/debug-evidence
            build/verification-failures
          if-no-files-found: ignore
      - name: Upload native verification transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}
          path: verification-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.compiler }}.log
          if-no-files-found: warn
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Discard checked-in build artifacts
        shell: bash
        run: rm -rf build bin
      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = x86_64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-lldb
      - name: Record native runner and toolchain
        run: |
          log=verification-windows-2022-release.log
          {
            echo "revision=$GITHUB_SHA"
            echo "runner=windows-2022 UCRT64"
            echo "mode=release"
            echo "uname=$(uname -a)"
            clang --version
            make --version
            command -v llvm-dwarfdump || true
            command -v llvm-readobj || true
          } | tee "$log"
      - name: Require Windows PDB inspection tools
        run: |
          command -v lld-link
          command -v llvm-pdbutil
          command -v lldb
      - name: Probe Windows sanitizer runtimes
        run: |
          set -o pipefail
          make CC=clang check-sanitizer-availability 2>&1 | tee -a verification-windows-2022-release.log
      - name: Windows native execution
        run: |
          set -o pipefail
          python3 tests/run_bounded.py 600 make CC=clang BUILD_MODE=release -j2 test check-native-checks check-debug-metadata check-static-abi check-differential check-stress check-fuzz check-verification check-reproducible 2>&1 | tee -a verification-windows-2022-release.log
      - name: Windows source stepping and variable inspection
        run: |
          set -o pipefail
          BPP_REQUIRE_WINDOWS_DEBUGGER=1 make CC=clang BUILD_MODE=release DEBUGGER_TEST_ENV= check-debug-metadata 2>&1 | tee -a verification-windows-2022-release.log
      - name: Cross-target assembly
        run: |
          set -o pipefail
          make CC=clang BUILD_MODE=release check-targets 2>&1 | tee -a verification-windows-2022-release.log
      - name: Upload native verification transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-windows-2022-release
          path: verification-windows-2022-release.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Windows debug and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-windows-2022-release
          path: |
            build/debug-evidence
            build/verification-failures
          if-no-files-found: ignore
  msan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Discard checked-in build artifacts
        shell: bash
        run: rm -rf build bin
      - name: Verify Linux x86-64 MSAN runner
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - name: Record MSAN toolchain
        run: |
          log=verification-ubuntu-24.04-msan.log
          {
            echo "revision=$GITHUB_SHA"
            echo 'runner=ubuntu-24.04 x86_64'
            echo 'mode=msan'
            echo "uname=$(uname -a)"
            clang --version
            make --version
          } | tee "$log"
      - name: MemorySanitizer native execution
        run: |
          set -o pipefail
          python3 tests/run_bounded.py 600 make CC=clang BUILD_MODE=msan -j2 test check-fuzz check-verification check-reproducible 2>&1 | tee -a verification-ubuntu-24.04-msan.log
      - name: MemorySanitizer differential execution
        run: |
          set -o pipefail
          make CC=clang BUILD_MODE=msan check-differential 2>&1 | tee -a verification-ubuntu-24.04-msan.log
      - name: MemorySanitizer large procedure
        run: |
          set -o pipefail
          make CC=clang BUILD_MODE=msan check-stress 2>&1 | tee -a verification-ubuntu-24.04-msan.log
      - name: Upload MSAN verification transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-ubuntu-24.04-msan
          path: verification-ubuntu-24.04-msan.log
          if-no-files-found: warn
          retention-days: 30
